name: Deploy App Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy to App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: project-0fa1ad10-8b1e-4ade-9df
          deliverables: app.yaml
          promote: true
          env_vars: |-
            GOOGLE_CLOUD_PROJECT=project-0fa1ad10-8b1e-4ade-9df
            GOOGLE_CLIENT_ID=617369660388-6ou6v8iv6ae3t4idbdl6fst2smjdmkmr.apps.googleusercontent.com
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Seed ghost catalog
        run: >-
          gcloud builds submit
          --config cloudbuild.seed.yaml
          --substitutions=_GOOGLE_CLOUD_PROJECT=project-0fa1ad10-8b1e-4ade-9df
          --project project-0fa1ad10-8b1e-4ade-9df
          --quiet

      - name: Print deployed URL
        run: echo "Deployed ${{ steps.deploy.outputs.version_url }}"
